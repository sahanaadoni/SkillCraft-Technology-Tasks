<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Game Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-container" id="quiz">
    <!-- Quiz Header -->
    <div class="quiz-header">
      <h2>Quiz Game</h2>
      <div id="progress-container">
        <span id="question-number">Question 1</span>
      </div>
    </div>

    <!-- Question Body -->
    <div class="quiz-body" id="quiz-body">
      <h3 id="question-text">Loading question...</h3>
      <div id="options-container" class="options-container"></div>
    </div>

    <!-- Controls -->
    <div class="quiz-footer">
      <button id="next-btn" onclick="submitAnswer()">Next Question</button>
    </div>

    <!-- Score Screen -->
    <div id="score-container" class="score-container hidden">
      <h2>Quiz Completed!</h2>
      <p id="score-text">Your Score: 0 / 0</p>
      <button onclick="restartQuiz()">Restart Quiz</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
